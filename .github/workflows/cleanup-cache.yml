name: Cleanup Actions Caches

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Automatically run every Sunday at midnight

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete All Caches
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Fetching list of repository caches...");
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            if (!caches.data.actions_caches || caches.data.actions_caches.length === 0) {
              console.log("No caches found to delete.");
              return;
            }

            console.log(`Found ${caches.data.actions_caches.length} cache(s). Proceeding with deletion...`);
            for (const cache of caches.data.actions_caches) {
              console.log(`Deleting cache: ${cache.key} (ID: ${cache.id})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }
            console.log("All repository caches cleared successfully.");
