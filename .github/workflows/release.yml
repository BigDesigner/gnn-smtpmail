name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version Override (Optional, e.g., 1.0.0). If empty, version will be read from gnn-smtpmail.php'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Version from gnn-smtpmail/gnn-smtpmail.php
        id: get_version
        run: |
          VERSION_INPUT="${{ github.event.inputs.version_override }}"
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION=$(grep -m 1 "Version:" gnn-smtpmail/gnn-smtpmail.php | awk '{print $NF}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Zip Plugin Directory
        run: |
          # The repository now stores the plugin exactly as it should ship,
          # under the gnn-smtpmail/ folder, so we just zip it directly.
          ZIP_NAME="gnn-smtpmail-${{ env.VERSION }}.zip"
          zip -r "$ZIP_NAME" gnn-smtpmail -x '*.DS_Store'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
